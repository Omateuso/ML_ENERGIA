name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5 exige >= 3.12, entao 3.11 esta fora.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # O historico e grande por causa do dataset antigo; so o topo importa.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        # Os testes que dependem dos dados baixados (~195 MB) se marcam como
        # skip sozinhos; aqui rodam os que nao precisam de artefato.
        run: pytest -q
